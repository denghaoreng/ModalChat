<form>
    <div class="flex-container flexFlowColumn" style="gap:8px;padding:8px;">
        <h3 style="margin:0;">多模态聊天设置</h3>
        <p style="font-size:0.9em;opacity:0.7;">
            多模态聊天（ModalChat）是 chat-images 和 MatchScoring 的融合插件。
            相关配置请在导航栏面板中操作。
        </p>
        <div style="padding:12px;background:var(--white15);border-radius:6px;">
            <label class="checkbox_label">
                <input type="checkbox" id="mc-enabled">
                <span>启用插件</span>
            </label>
        </div>
        <div style="padding:12px;background:var(--white15);border-radius:6px;">
            <label class="checkbox_label">
                <input type="checkbox" id="mc-auto-detect">
                <span>自动检测（AI 回复后自动触发匹配）</span>
            </label>
        </div>
    </div>
</form>
